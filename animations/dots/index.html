<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner Dots - MultiCBA</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a14;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Spinner Dots · 3s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function draw(){t+=0.016;ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,640,360);
for(let i=0;i<3;i++){const s=0.5+0.5*Math.sin(t*4-i*0.8);ctx.beginPath();ctx.arc(280+i*40,180,8+s*6,0,Math.PI*2);ctx.fillStyle=`rgba(0,240,255,${0.4+s*0.6})`;ctx.fill();}
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=400;g.gain.setValueAtTime(0.08,actx.currentTime+i*0.2);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*0.2+0.1);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*0.2);o.stop(actx.currentTime+i*0.2+0.12);}}
setTimeout(snd,300);setInterval(snd,3000);
MultiCBABindDownload('dl',canvas,3,'spinner-dots');
</script></body></html>
