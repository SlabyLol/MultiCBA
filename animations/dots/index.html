<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinner Dots - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a14; height: 100vh;
      display: flex; align-items: center; justify-content: center; gap: 14px; overflow: hidden;
    }
    .dot {
      width: 18px; height: 18px; background: #00f0ff; border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
      40% { transform: scale(1.3); opacity: 1; }
    }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #888; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
    }
    .info a { color: #00f0ff; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.animationDelay = (i * 0.2) + 's';
      document.body.appendChild(d);
    }
  </script>
  <div class="info">Spinner Dots · 3s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      for (let i = 0; i < 3; i++) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 400;
        g.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.2 + 0.12);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + i * 0.2); o.stop(ctx.currentTime + i * 0.2 + 0.15);
      }
    }
    setTimeout(play, 300);
    setInterval(play, 3000);
  </script>
</body>
</html>
