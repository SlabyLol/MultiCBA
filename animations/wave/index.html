<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Bars - MultiCBA</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080812;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Wave Bars · 3s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function draw(){t+=0.016;ctx.fillStyle='#080812';ctx.fillRect(0,0,640,360);
const n=12,w=14,gap=10,total=n*(w+gap);let x=320-total/2;
for(let i=0;i<n;i++){const h=20+Math.abs(Math.sin(t*3+i*0.4))*70;const g=ctx.createLinearGradient(0,180+h/2,0,180-h/2);g.addColorStop(0,'#00f0ff');g.addColorStop(1,'#ff00aa');ctx.fillStyle=g;ctx.fillRect(x,180-h/2,w,h);x+=w+gap;}
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();[220,330,440].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.08,actx.currentTime+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*0.12+0.3);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*0.12);o.stop(actx.currentTime+i*0.12+0.35);});}
setTimeout(snd,300);setInterval(snd,3000);
MultiCBABindDownload('dl',canvas,3,'wave-bars');
</script>
</body></html>
