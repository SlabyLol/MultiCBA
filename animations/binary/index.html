<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binary Stream - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; height: 100vh; overflow: hidden;
      font-family: monospace; font-size: 14px; color: #00f0ff;
      line-height: 1.4; padding: 10px; opacity: 0.85;
      white-space: pre; animation: scroll 10s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #00f0ff; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 8px;
      white-space: normal;
    }
    .info a { color: #00f0ff; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    let bin = '';
    for (let i = 0; i < 60; i++) {
      for (let j = 0; j < 80; j++) bin += Math.random() > 0.5 ? '1' : '0';
      bin += '\n';
    }
    document.body.insertAdjacentText('afterbegin', bin + bin);
  </script>
  <div class="info">Binary Stream · 6s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      for (let i = 0; i < 10; i++) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square'; o.frequency.value = 90 + (i % 5) * 40;
        g.gain.setValueAtTime(0.035, ctx.currentTime + i * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.07);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + i * 0.08); o.stop(ctx.currentTime + i * 0.08 + 0.1);
      }
    }
    setTimeout(play, 300);
    setInterval(play, 2000);
  </script>
</body>
</html>
