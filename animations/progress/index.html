<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Boot - MultiCBA</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Progress Boot · 7s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function draw(){t+=0.016;ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,640,360);
ctx.fillStyle='#666';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('STARTING SYSTEM',320,150);
const pct=Math.min(1,(t%7)/5);ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(170,190,300,8);
const g=ctx.createLinearGradient(170,0,470,0);g.addColorStop(0,'#00f0ff');g.addColorStop(1,'#ff00aa');ctx.fillStyle=g;ctx.fillRect(170,190,300*pct,8);
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();[200,300,400,600].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;const tt=actx.currentTime+i*1.4;g.gain.setValueAtTime(0.1,tt);g.gain.exponentialRampToValueAtTime(0.001,tt+0.35);o.connect(g);g.connect(actx.destination);o.start(tt);o.stop(tt+0.4);});}
setTimeout(snd,300);setInterval(snd,7000);
MultiCBABindDownload('dl',canvas,7,'progress-boot');
</script></body></html>
