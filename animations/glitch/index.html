<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Text - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    .glitch {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 700; color: #fff; position: relative;
      animation: glitch 2s infinite;
      letter-spacing: 4px;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before {
      color: #0ff; animation: gTop 1.5s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }
    .glitch::after {
      color: #f0f; animation: gBot 1.8s infinite;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-3px, 1px); }
      94% { transform: translate(3px, -1px); }
      96% { transform: translate(-2px, 2px); }
    }
    @keyframes gTop {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(4px, -1px); }
      94% { transform: translate(-4px, 1px); }
    }
    @keyframes gBot {
      0%, 90%, 100% { transform: translate(0); }
      93% { transform: translate(-4px, 0); }
      95% { transform: translate(4px, 1px); }
    }
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px;
      background: rgba(0,0,0,0.85); display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    }
    .bar input {
      background: #1a1a1a; border: 1px solid #0ff; color: #fff; padding: 7px 12px;
      border-radius: 6px; font-size: 0.9rem; width: 160px;
    }
    .bar a {
      background: #0a1a1a; color: #0ff; border: 1px solid #0ff; padding: 7px 14px;
      border-radius: 6px; text-decoration: none; font-size: 0.9rem;
    }
    .bar span { color: #888; font-size: 0.85rem; }
    body.preview .bar { display: none; }
  </style>
</head>
<body>
  <div class="glitch" id="gtext" data-text="SYSTEM">SYSTEM</div>
  <div class="bar">
    <span>Glitch Text · 5s · Edit:</span>
    <input type="text" id="customText" value="SYSTEM" maxlength="16" placeholder="Your text">
    <a href="../../index.html">← Gallery</a>
  </div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const g = document.getElementById('gtext');
    document.getElementById('customText').oninput = (e) => {
      const v = e.target.value || 'SYSTEM';
      g.textContent = v;
      g.setAttribute('data-text', v);
    };

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      const bs = ctx.sampleRate * 0.12;
      const buf = ctx.createBuffer(1, bs, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
      const n = ctx.createBufferSource(); n.buffer = buf;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.12, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      n.connect(g2); g2.connect(ctx.destination); n.start();
    }
    setTimeout(play, 300);
    setInterval(play, 2000);
  </script>
</body>
</html>
