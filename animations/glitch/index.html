<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Text - MultiCBA</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0d0d;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar input{background:#1a1a1a;border:1px solid #0ff;color:#fff;padding:7px 12px;border-radius:6px;width:140px}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Glitch · 5s</span><input id="txt" value="SYSTEM" maxlength="16"><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let text='SYSTEM';document.getElementById('txt').oninput=e=>{text=e.target.value||'SYSTEM'};
let t=0;
function draw(){t+=0.016;ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,640,360);
const glitch=Math.random()>0.92;const ox=glitch?(Math.random()-0.5)*8:0;
ctx.font='bold 56px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillStyle='#0ff';ctx.fillText(text,320+ox-2,180);
ctx.fillStyle='#f0f';ctx.fillText(text,320+ox+2,180);
ctx.fillStyle='#fff';ctx.fillText(text,320+ox,180);
if(glitch){ctx.fillStyle='rgba(0,255,255,0.15)';ctx.fillRect(0,Math.random()*360,640,8);}
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();const bs=actx.sampleRate*0.1;const buf=actx.createBuffer(1,bs,actx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=Math.random()*2-1;const n=actx.createBufferSource();n.buffer=buf;const g=actx.createGain();g.gain.value=0.1;n.connect(g);g.connect(actx.destination);n.start();}
setTimeout(snd,300);setInterval(snd,2000);
MultiCBABindDownload('dl',canvas,5,'glitch-text');
</script></body></html>
