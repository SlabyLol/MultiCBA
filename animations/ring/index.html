<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Ring - MultiCBA</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Loading Ring · 4s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function draw(){t+=0.016;ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,640,360);
ctx.save();ctx.translate(320,180);
ctx.strokeStyle='#00f0ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,50,t*4,t*4+Math.PI*1.3);ctx.stroke();
ctx.strokeStyle='#ff00aa';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,35,-t*3,-t*3+Math.PI*1.2);ctx.stroke();
ctx.restore();requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=320;g.gain.setValueAtTime(0.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.7);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.75);}
setTimeout(snd,300);setInterval(snd,4000);
MultiCBABindDownload('dl',canvas,4,'loading-ring');
</script>
</body></html>
