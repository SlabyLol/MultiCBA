<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Ring - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12; height: 100vh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .ring {
      width: 100px; height: 100px;
      border: 5px solid transparent;
      border-top-color: #00f0ff;
      border-right-color: #ff00aa;
      border-radius: 50%;
      position: relative;
      animation: spin 1s linear infinite;
    }
    .ring::after {
      content: ''; position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 4px solid transparent;
      border-bottom-color: #00ff88;
      border-radius: 50%;
      animation: spin 1.4s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #888; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
    }
    .info a { color: #00f0ff; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <div class="ring"></div>
  <div class="info">Loading Ring · 4s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = 320;
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.85);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'triangle'; o2.frequency.value = 480;
      g2.gain.setValueAtTime(0.08, ctx.currentTime + 0.2);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      o2.connect(g2); g2.connect(ctx.destination);
      o2.start(ctx.currentTime + 0.2); o2.stop(ctx.currentTime + 0.85);
    }
    setTimeout(play, 300);
    setInterval(play, 4000);
  </script>
</body>
</html>
