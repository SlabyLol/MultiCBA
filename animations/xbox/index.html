<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xbox Boot - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    canvas { display: block; max-width: 100%; max-height: 80vh; }
    .bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px; background: rgba(0,0,0,0.85); display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .bar button, .bar a { background: #107c10; color: #fff; border: 1px solid #3ddc84; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    .bar button:hover, .bar a:hover { background: #3ddc84; color: #000; }
    .bar button:disabled { opacity: 0.5; cursor: wait; }
    .bar span { color: #888; font-size: 0.85rem; }
    body.preview .bar { display: none; }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="360"></canvas>
  <div class="bar">
    <span>Xbox Boot · 6s</span>
    <button id="dl">⬇ Download Video</button>
    <a href="../../index.html">← Gallery</a>
  </div>
  <script src="../../js/download.js"></script>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let t = 0;

    function draw() {
      t += 0.016;
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, 640, 360);

      // green glow
      const rg = ctx.createRadialGradient(320, 170, 20, 320, 170, 160);
      rg.addColorStop(0, 'rgba(16, 124, 16, 0.35)');
      rg.addColorStop(1, 'transparent');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, 640, 360);

      // sphere
      const s = 0.3 + 0.7 * Math.min(1, t / 1.2);
      ctx.save();
      ctx.translate(320, 160);
      ctx.scale(s, s);
      const grad = ctx.createRadialGradient(-15, -15, 5, 0, 0, 55);
      grad.addColorStop(0, '#5dff5d');
      grad.addColorStop(0.6, '#107c10');
      grad.addColorStop(1, '#0a4a0a');
      ctx.beginPath();
      ctx.arc(0, 0, 55, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // X shape
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-28, -28); ctx.lineTo(28, 28);
      ctx.moveTo(28, -28); ctx.lineTo(-28, 28);
      ctx.stroke();
      ctx.restore();

      if (t > 1.8) {
        const a = Math.min(1, (t - 1.8) / 0.7);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('XBOX', 320, 260);
        ctx.globalAlpha = 1;
      }

      // ring expand
      if (t > 0.5 && t < 3) {
        const r = (t - 0.5) * 80;
        ctx.beginPath();
        ctx.arc(320, 160, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(61, 220, 132, ${1 - (t - 0.5) / 2.5})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }
    draw();

    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function bootSound() {
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(400, actx.currentTime + 0.5);
      g.gain.setValueAtTime(0.15, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 1);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 1.05);
    }
    setTimeout(bootSound, 400);

    document.getElementById('dl').onclick = async function () {
      const btn = this; btn.disabled = true; btn.textContent = 'Recording…';
      try {
        await MultiCBADownload(canvas, 6, 'xbox-boot');
        btn.textContent = 'Downloaded!';
      } catch (e) { btn.textContent = 'Error'; console.error(e); }
      setTimeout(() => { btn.disabled = false; btn.textContent = '⬇ Download Video'; }, 2000);
    };
  </script>
</body>
</html>
