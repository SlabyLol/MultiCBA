<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Burst - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050510; height: 100vh; overflow: hidden; position: relative; }
    .particle {
      position: absolute; width: 8px; height: 8px; border-radius: 50%;
      left: 50%; top: 50%;
      animation: out 2s ease-out infinite;
    }
    @keyframes out {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #00f0ff; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
    }
    .info a { color: #00f0ff; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <div class="info">Particle Burst · 4s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const body = document.body;
    for (let i = 0; i < 36; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (i / 36) * Math.PI * 2;
      const dist = 120 + Math.random() * 100;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.animationDelay = (Math.random() * 0.6) + 's';
      p.style.background = `hsl(${180 + Math.random() * 80}, 100%, 60%)`;
      body.appendChild(p);
    }

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      // noise burst
      const bufferSize = ctx.sampleRate * 0.4;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      noise.connect(g); g.connect(ctx.destination);
      noise.start();
      // sweep
      const o = ctx.createOscillator(), g2 = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(900, ctx.currentTime);
      o.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.5);
      g2.gain.setValueAtTime(0.1, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.connect(g2); g2.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.55);
    }
    setTimeout(play, 300);
    setInterval(play, 4000);
  </script>
</body>
</html>
