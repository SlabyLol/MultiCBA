<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Burst - MultiCBA</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Particle Burst · 4s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const parts=[];for(let i=0;i<40;i++){const a=(i/40)*Math.PI*2;parts.push({a,sp:1.5+Math.random(),hue:180+Math.random()*80,ph:Math.random()*2});}
let t=0;
function draw(){t+=0.016;ctx.fillStyle='#050510';ctx.fillRect(0,0,640,360);
const cycle=(t%2);parts.forEach(p=>{const d=cycle*p.sp*70;const x=320+Math.cos(p.a)*d;const y=180+Math.sin(p.a)*d;const alpha=1-cycle;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},100%,60%,${alpha})`;ctx.fill();});
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(800,actx.currentTime);o.frequency.linearRampToValueAtTime(120,actx.currentTime+0.4);g.gain.setValueAtTime(0.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.4);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.45);}
setTimeout(snd,300);setInterval(snd,4000);
MultiCBABindDownload('dl',canvas,4,'particle-burst');
</script>
</body></html>
