<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexagon Spin - MultiCBA</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080812;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Hexagon Spin · 4s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function hex(cx,cy,r,rot,color){ctx.beginPath();for(let i=0;i<6;i++){const a=rot+i*Math.PI/3;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.stroke();}
function draw(){t+=0.016;ctx.fillStyle='#080812';ctx.fillRect(0,0,640,360);hex(320,180,55,t, '#00f0ff');hex(320,180,55,t+Math.PI/6,'#ff00aa');
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();[350,525].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.08,actx.currentTime+i*0.2);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*0.2+0.35);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*0.2);o.stop(actx.currentTime+i*0.2+0.4);});}
setTimeout(snd,300);setInterval(snd,4000);
MultiCBABindDownload('dl',canvas,4,'hexagon-spin');
</script></body></html>
