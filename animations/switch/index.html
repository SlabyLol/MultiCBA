<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Boot - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    canvas { display: block; max-width: 100%; max-height: 80vh; }
    .bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px; background: rgba(0,0,0,0.85); display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .bar button, .bar a { background: #e60012; color: #fff; border: 1px solid #ff4554; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    .bar button:hover, .bar a:hover { background: #ff4554; }
    .bar button:disabled { opacity: 0.5; cursor: wait; }
    .bar span { color: #888; font-size: 0.85rem; }
    body.preview .bar { display: none; }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="360"></canvas>
  <div class="bar">
    <span>Nintendo Switch · 5s</span>
    <button id="dl">⬇ Download Video</button>
    <a href="../../index.html">← Gallery</a>
  </div>
  <script src="../../js/download.js"></script>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let t = 0;

    function draw() {
      t += 0.016;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 640, 360);

      // Joy-Con style: left blue, right red rectangles sliding in
      const slide = Math.min(1, t / 1.0);
      // left (blue)
      ctx.fillStyle = '#0ab9e6';
      ctx.beginPath();
      ctx.roundRect(200 - (1 - slide) * 100, 100, 50, 140, 12);
      ctx.fill();
      // right (red)
      ctx.fillStyle = '#ff3c28';
      ctx.beginPath();
      ctx.roundRect(390 + (1 - slide) * 100, 100, 50, 140, 12);
      ctx.fill();
      // screen (center)
      if (t > 0.6) {
        const a = Math.min(1, (t - 0.6) / 0.5);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.roundRect(250, 110, 140, 120, 4);
        ctx.fill();
        // gray screen content
        ctx.fillStyle = '#333';
        ctx.fillRect(260, 120, 120, 100);
        ctx.globalAlpha = 1;
      }

      if (t > 1.8) {
        const a = Math.min(1, (t - 1.8) / 0.6);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Nintendo Switch', 320, 290);
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(draw);
    }
    draw();

    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function bootSound() {
      if (actx.state === 'suspended') actx.resume();
      [523, 659, 784].forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0.06, actx.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + i * 0.12 + 0.25);
        o.connect(g); g.connect(actx.destination);
        o.start(actx.currentTime + i * 0.12); o.stop(actx.currentTime + i * 0.12 + 0.3);
      });
    }
    setTimeout(bootSound, 400);

    document.getElementById('dl').onclick = async function () {
      const btn = this; btn.disabled = true; btn.textContent = 'Recording…';
      try {
        await MultiCBADownload(canvas, 5, 'switch-boot');
        btn.textContent = 'Downloaded!';
      } catch (e) { btn.textContent = 'Error'; console.error(e); }
      setTimeout(() => { btn.disabled = false; btn.textContent = '⬇ Download Video'; }, 2000);
    };
  </script>
</body>
</html>
