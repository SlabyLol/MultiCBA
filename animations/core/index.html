<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Pulse - MultiCBA</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#05050f;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Core Pulse · 4s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function draw(){t+=0.016;ctx.fillStyle='#05050f';ctx.fillRect(0,0,640,360);
const s=0.7+0.5*Math.sin(t*2);const rg=ctx.createRadialGradient(320,180,5,320,180,60*s);rg.addColorStop(0,'#00f0ff');rg.addColorStop(0.5,'rgba(255,0,170,0.4)');rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(320,180,80*s,0,Math.PI*2);ctx.fill();
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=110;g.gain.setValueAtTime(0.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+1.1);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+1.15);}
setTimeout(snd,300);setInterval(snd,4000);
MultiCBABindDownload('dl',canvas,4,'core-pulse');
</script></body></html>
