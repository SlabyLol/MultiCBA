<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android Bounce - MultiCBA</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}
    canvas{display:block;max-width:100%;max-height:75vh}
    .bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
    .bar button,.bar a{background:#0a2;color:#3ddc84;border:1px solid #3ddc84;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}
    .bar button:hover,.bar a:hover{background:#3ddc84;color:#000}
    .bar button:disabled{opacity:.5;cursor:wait}
    .bar span{color:#666;font-size:.85rem}
    body.preview .bar{display:none}
  </style>
</head>
<body>
  <canvas id="c" width="640" height="360"></canvas>
  <div class="bar">
    <span>Android Bounce · 5s</span>
    <button id="dl">⬇ Download Video</button>
    <a href="../../index.html">← Gallery</a>
  </div>
  <script src="../../js/download.js"></script>
  <script>
    if(location.search.includes('preview=1'))document.body.classList.add('preview');
    const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
    let t=0;
    function draw(){
      t+=0.016;
      const g=ctx.createRadialGradient(320,180,20,320,180,200);
      g.addColorStop(0,'#1a3a1a');g.addColorStop(1,'#000');
      ctx.fillStyle=g;ctx.fillRect(0,0,640,360);
      const by=Math.sin(t*2.5)*25;
      ctx.save();ctx.translate(320,170+by);
      ctx.fillStyle='#3ddc84';
      ctx.beginPath();ctx.ellipse(0,10,40,42,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(0,-20,28,Math.PI,0);ctx.lineWidth=8;ctx.strokeStyle='#3ddc84';ctx.stroke();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(-14,0,6,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(14,0,6,0,Math.PI*2);ctx.fill();
      ctx.restore();
      requestAnimationFrame(draw);
    }
    draw();
    const actx=new(window.AudioContext||window.webkitAudioContext)();
    function snd(){if(actx.state==='suspended')actx.resume();[523,659,784].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.1,actx.currentTime+i*0.15);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*0.15+0.3);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*0.15);o.stop(actx.currentTime+i*0.15+0.35);});}
    setTimeout(snd,300);setInterval(snd,5000);
    MultiCBABindDownload('dl',canvas,5,'android-bounce');
  </script>
</body>
</html>
