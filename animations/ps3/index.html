<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS3 / BadCBA Boot - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    canvas { display: block; max-width: 100%; max-height: 75vh; }
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px;
      background: rgba(0,0,0,0.9); display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    }
    .bar input {
      background: #111; border: 1px solid #4a9eff; color: #fff; padding: 7px 12px;
      border-radius: 6px; font-size: 0.9rem; width: 140px;
    }
    .bar button, .bar a {
      background: #0a1628; color: #4a9eff; border: 1px solid #4a9eff; padding: 7px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none;
    }
    .bar button:hover, .bar a:hover { background: #4a9eff; color: #000; }
    .bar button:disabled { opacity: 0.5; cursor: wait; }
    .bar span { color: #666; font-size: 0.8rem; }
    body.preview .bar { display: none; }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="360"></canvas>
  <div class="bar">
    <span>PS3 / BadCBA · 8s</span>
    <input type="text" id="customText" value="BadCBA" maxlength="16" placeholder="Logo text">
    <button id="dl">⬇ Download Video</button>
    <a href="../../index.html">← Gallery</a>
  </div>
  <script src="../../js/download.js"></script>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let t = 0;
    let logoText = 'BadCBA';
    document.getElementById('customText').oninput = (e) => { logoText = e.target.value || 'BadCBA'; };

    // PS3-style: dark blue wave / XMB-ish ambient + rising logo
    function draw() {
      t += 0.016;
      // deep blue-black
      const bg = ctx.createLinearGradient(0, 0, 0, 360);
      bg.addColorStop(0, '#000510');
      bg.addColorStop(1, '#001028');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 640, 360);

      // soft waves (XMB vibe)
      for (let w = 0; w < 4; w++) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(80, 160, 255, ${0.08 + w * 0.03})`;
        ctx.lineWidth = 2;
        for (let x = 0; x <= 640; x += 4) {
          const y = 200 + Math.sin(x * 0.01 + t * 0.8 + w) * (18 + w * 8) + Math.sin(x * 0.02 - t + w) * 8;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // glow orb
      const pulse = 0.6 + 0.4 * Math.sin(t * 2);
      const rg = ctx.createRadialGradient(320, 140, 5, 320, 140, 90 * pulse);
      rg.addColorStop(0, 'rgba(100, 180, 255, 0.35)');
      rg.addColorStop(1, 'transparent');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, 640, 360);

      // logo fade in
      if (t > 1) {
        const a = Math.min(1, (t - 1) / 1.2);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(logoText, 320, 150);
        ctx.font = '14px sans-serif';
        ctx.fillStyle = 'rgba(150, 200, 255, 0.9)';
        ctx.fillText('for the PS3 lol', 320, 180);
        ctx.globalAlpha = 1;
      }

      // bottom hint
      if (t > 3) {
        const a = Math.min(1, (t - 3) / 0.8);
        ctx.globalAlpha = a * 0.7;
        ctx.fillStyle = '#6af';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Actually I thought I can just make it for BadCBA for the PS3 lol', 320, 320);
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(draw);
    }
    draw();

    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function bootSound() {
      if (actx.state === 'suspended') actx.resume();
      // soft PS3-ish pad
      [220, 277, 330, 440].forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.06, actx.currentTime + i * 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + i * 0.2 + 1.2);
        o.connect(g); g.connect(actx.destination);
        o.start(actx.currentTime + i * 0.2); o.stop(actx.currentTime + i * 0.2 + 1.3);
      });
    }
    setTimeout(bootSound, 500);

    document.getElementById('dl').onclick = async function () {
      const btn = this; btn.disabled = true; btn.textContent = 'Recording…';
      try {
        await MultiCBADownload(canvas, 8, 'ps3-badcba-boot');
        btn.textContent = 'Downloaded!';
      } catch (e) { btn.textContent = 'Error'; console.error(e); }
      setTimeout(() => { btn.disabled = false; btn.textContent = '⬇ Download Video'; }, 2000);
    };
  </script>
</body>
</html>
