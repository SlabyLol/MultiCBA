<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Pulse - MultiCBA</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}
    canvas{display:block;max-width:100%;max-height:75vh}
    .bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
    .bar button,.bar a{background:#062;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}
    .bar button:hover,.bar a:hover{background:#0ff;color:#000}
    .bar button:disabled{opacity:.5;cursor:wait}
    .bar span{color:#666;font-size:.85rem}
    body.preview .bar{display:none}
  </style>
</head>
<body>
  <canvas id="c" width="640" height="360"></canvas>
  <div class="bar">
    <span>Neon Pulse · 6s</span>
    <button id="dl">⬇ Download Video</button>
    <a href="../../index.html">← Gallery</a>
  </div>
  <script src="../../js/download.js"></script>
  <script>
    if(location.search.includes('preview=1'))document.body.classList.add('preview');
    const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
    let t=0;
    function draw(){
      t+=0.016;
      ctx.fillStyle='#000';ctx.fillRect(0,0,640,360);
      const pulse=0.55+0.45*Math.abs(Math.sin(t*2.1));
      ctx.save();
      ctx.shadowColor='#00f0ff';ctx.shadowBlur=30*pulse;
      ctx.strokeStyle=`rgba(0,240,255,${pulse})`;
      ctx.lineWidth=3;
      ctx.font='bold 64px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeText('BOOT',320,180);
      ctx.fillStyle=`rgba(0,240,255,${0.15*pulse})`;
      ctx.fillText('BOOT',320,180);
      ctx.restore();
      requestAnimationFrame(draw);
    }
    draw();
    const actx=new(window.AudioContext||window.webkitAudioContext)();
    function snd(){if(actx.state==='suspended')actx.resume();[440,554,659].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.1,actx.currentTime+i*0.15);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*0.15+0.4);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*0.15);o.stop(actx.currentTime+i*0.15+0.45);});}
    setTimeout(snd,300);setInterval(snd,6000);
    MultiCBABindDownload('dl',canvas,6,'neon-pulse');
  </script>
</body>
</html>
