<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle, #0a1020, #000);
      height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .center {
      width: 20px; height: 20px; background: #00f0ff; border-radius: 50%;
      box-shadow: 0 0 20px #00f0ff; z-index: 2;
    }
    .path {
      position: absolute; border: 1px solid rgba(0,240,255,0.25); border-radius: 50%;
      animation: orbit linear infinite;
    }
    .path::after {
      content: ''; position: absolute; top: -6px; left: 50%;
      width: 12px; height: 12px; background: #ff00aa; border-radius: 50%;
      box-shadow: 0 0 12px #ff00aa;
    }
    @keyframes orbit { to { transform: rotate(360deg); } }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #888; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
    }
    .info a { color: #00f0ff; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <div class="center"></div>
  <div class="path" style="width:100px;height:100px;animation-duration:2s"></div>
  <div class="path" style="width:150px;height:150px;animation-duration:3.2s;animation-direction:reverse"></div>
  <div class="path" style="width:200px;height:200px;animation-duration:4.5s"></div>
  <div class="info">Orbit · 4s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 260;
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.95);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'sine'; o2.frequency.value = 390;
      g2.gain.setValueAtTime(0.07, ctx.currentTime + 0.3);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
      o2.connect(g2); g2.connect(ctx.destination);
      o2.start(ctx.currentTime + 0.3); o2.stop(ctx.currentTime + 1.05);
    }
    setTimeout(play, 300);
    setInterval(play, 4000);
  </script>
</body>
</html>
