<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit - MultiCBA</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#012;color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Orbit · 4s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function draw(){t+=0.016;const bg=ctx.createRadialGradient(320,180,10,320,180,200);bg.addColorStop(0,'#0a1020');bg.addColorStop(1,'#000');ctx.fillStyle=bg;ctx.fillRect(0,0,640,360);
ctx.beginPath();ctx.arc(320,180,8,0,Math.PI*2);ctx.fillStyle='#00f0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;
[[50,2],[70,3.2,-1],[95,4.5]].forEach(([r,spd,dir])=>{dir=dir||1;ctx.beginPath();ctx.arc(320,180,r,0,Math.PI*2);ctx.strokeStyle='rgba(0,240,255,0.25)';ctx.lineWidth=1;ctx.stroke();
const a=t*spd*dir;ctx.beginPath();ctx.arc(320+Math.cos(a)*r,180+Math.sin(a)*r,5,0,Math.PI*2);ctx.fillStyle='#ff00aa';ctx.shadowColor='#f0a';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;});
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();[260,390].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.08,actx.currentTime+i*0.25);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*0.25+0.7);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*0.25);o.stop(actx.currentTime+i*0.25+0.75);});}
setTimeout(snd,300);setInterval(snd,4000);
MultiCBABindDownload('dl',canvas,4,'orbit');
</script></body></html>
