<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typewriter - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; height: 100vh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      font-family: monospace; font-size: clamp(1.2rem, 4vw, 1.8rem); color: #00ff88;
    }
    .cursor {
      display: inline-block; width: 10px; height: 1.2em;
      background: #00ff88; margin-left: 3px;
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #00ff88; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
      font-family: system-ui, sans-serif;
    }
    .info a { color: #00ff88; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <span id="text">Booting</span><span class="cursor"></span>
  <div class="info">Typewriter · 5s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const texts = ['Booting', 'Loading modules', 'Starting services', 'Initializing UI', 'Ready'];
    let i = 0;
    const el = document.getElementById('text');
    setInterval(() => {
      i = (i + 1) % texts.length;
      el.textContent = texts[i];
    }, 1200);

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      for (let j = 0; j < 5; j++) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square'; o.frequency.value = 550 + Math.random() * 120;
        g.gain.setValueAtTime(0.06, ctx.currentTime + j * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + j * 0.1 + 0.06);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + j * 0.1); o.stop(ctx.currentTime + j * 0.1 + 0.08);
      }
    }
    setTimeout(play, 300);
    setInterval(play, 2500);
  </script>
</body>
</html>
