<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typewriter - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
      font-family: monospace; font-size: clamp(1.2rem, 4vw, 1.8rem); color: #00ff88;
    }
    .cursor {
      display: inline-block; width: 10px; height: 1.2em;
      background: #00ff88; margin-left: 3px;
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px;
      background: rgba(0,0,0,0.85); display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
      font-family: system-ui, sans-serif; font-size: 0.9rem;
    }
    .bar input {
      background: #1a1a1a; border: 1px solid #00ff88; color: #fff; padding: 7px 12px;
      border-radius: 6px; width: 200px;
    }
    .bar a {
      background: #0a1a0a; color: #00ff88; border: 1px solid #00ff88; padding: 7px 14px;
      border-radius: 6px; text-decoration: none;
    }
    .bar span { color: #666; }
    body.preview .bar { display: none; }
  </style>
</head>
<body>
  <div><span id="text">Booting</span><span class="cursor"></span></div>
  <div class="bar">
    <span>Typewriter · Edit lines (comma separated):</span>
    <input type="text" id="customText" value="Booting, Loading modules, Starting services, Ready" placeholder="line1, line2, line3">
    <a href="../../index.html">← Gallery</a>
  </div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    let texts = ['Booting', 'Loading modules', 'Starting services', 'Ready'];
    let i = 0;
    const el = document.getElementById('text');

    document.getElementById('customText').oninput = (e) => {
      texts = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
      if (!texts.length) texts = ['Booting'];
      i = 0;
      el.textContent = texts[0];
    };

    setInterval(() => {
      i = (i + 1) % texts.length;
      el.textContent = texts[i];
    }, 1200);

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      for (let j = 0; j < 4; j++) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square'; o.frequency.value = 550 + Math.random() * 100;
        g.gain.setValueAtTime(0.05, ctx.currentTime + j * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + j * 0.1 + 0.06);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + j * 0.1); o.stop(ctx.currentTime + j * 0.1 + 0.08);
      }
    }
    setTimeout(play, 300);
    setInterval(play, 2500);
  </script>
</body>
</html>
