<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Reveal - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    .text {
      font-size: clamp(2rem, 9vw, 4.5rem);
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #00f0ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: reveal 3s ease-out infinite;
      letter-spacing: 6px;
    }
    @keyframes reveal {
      0% { opacity: 0; letter-spacing: 30px; filter: blur(10px); }
      40% { opacity: 1; letter-spacing: 6px; filter: blur(0); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px;
      background: rgba(0,0,0,0.85); display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    }
    .bar input {
      background: #1a1a1a; border: 1px solid #00f0ff; color: #fff; padding: 7px 12px;
      border-radius: 6px; font-size: 0.9rem; width: 180px;
    }
    .bar button, .bar a {
      background: #0a2a2a; color: #00f0ff; border: 1px solid #00f0ff; padding: 7px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none;
    }
    .bar button:hover, .bar a:hover { background: #00f0ff; color: #000; }
    .bar span { color: #888; font-size: 0.85rem; }
    body.preview .bar { display: none; }
  </style>
</head>
<body>
  <div class="text" id="logoText">MULTICBA</div>
  <div class="bar">
    <span>Logo Reveal · 6s · Edit text:</span>
    <input type="text" id="customText" value="MULTICBA" maxlength="20" placeholder="Your text">
    <a href="../../index.html">← Gallery</a>
  </div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const el = document.getElementById('logoText');
    document.getElementById('customText').oninput = (e) => {
      el.textContent = e.target.value || 'MULTICBA';
    };

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(200, ctx.currentTime);
      o.frequency.linearRampToValueAtTime(900, ctx.currentTime + 1.3);
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 1.35);
    }
    setTimeout(play, 300);
    setInterval(play, 6000);
  </script>
</body>
</html>
