<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Reveal - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; height: 100vh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: clamp(2rem, 9vw, 4.5rem);
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #00f0ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: reveal 3s ease-out infinite;
      letter-spacing: 6px;
    }
    @keyframes reveal {
      0% { opacity: 0; letter-spacing: 30px; filter: blur(10px); }
      40% { opacity: 1; letter-spacing: 6px; filter: blur(0); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #888; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
    }
    .info a { color: #00f0ff; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <div class="text">MULTICBA</div>
  <div class="info">Logo Reveal · 6s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(200, ctx.currentTime);
      o.frequency.linearRampToValueAtTime(900, ctx.currentTime + 1.3);
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 1.35);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'sine'; o2.frequency.value = 880;
      g2.gain.setValueAtTime(0.08, ctx.currentTime + 1.1);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.6);
      o2.connect(g2); g2.connect(ctx.destination);
      o2.start(ctx.currentTime + 1.1); o2.stop(ctx.currentTime + 1.65);
    }
    setTimeout(play, 300);
    setInterval(play, 6000);
  </script>
</body>
</html>
