<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Flame - MultiCBA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 80%, #1a0a00, #000);
      height: 100vh; display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 25%; overflow: hidden; gap: 6px;
    }
    .flame {
      width: 40px; border-radius: 50% 50% 20% 20%;
      background: linear-gradient(to top, #ff4400, #ffaa00, transparent);
      animation: flame 0.55s ease-in-out infinite alternate;
      filter: blur(1px);
    }
    @keyframes flame {
      0% { height: 50px; transform: scaleX(1); }
      100% { height: 90px; transform: scaleX(1.15); }
    }
    .info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #ff8800; font-size: 0.85rem; text-align: center;
      background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
    }
    .info a { color: #ff8800; }
    body.preview .info { display: none; }
  </style>
</head>
<body>
  <script>
    if (location.search.includes('preview=1')) document.body.classList.add('preview');
    for (let i = 0; i < 6; i++) {
      const f = document.createElement('div');
      f.className = 'flame';
      f.style.animationDelay = (i * 0.08) + 's';
      f.style.height = (55 + Math.random() * 25) + 'px';
      document.body.appendChild(f);
    }
  </script>
  <div class="info">Energy Flame · 5s · <a href="../../index.html">← Back to MultiCBA</a></div>
  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function play() {
      if (ctx.state === 'suspended') ctx.resume();
      const bs = ctx.sampleRate * 0.5;
      const buf = ctx.createBuffer(1, bs, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
      const n = ctx.createBufferSource(); n.buffer = buf;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.09, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      n.connect(g); g.connect(ctx.destination); n.start();
      const o = ctx.createOscillator(), g2 = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(160, ctx.currentTime);
      o.frequency.linearRampToValueAtTime(70, ctx.currentTime + 0.7);
      g2.gain.setValueAtTime(0.1, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
      o.connect(g2); g2.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.75);
    }
    setTimeout(play, 300);
    setInterval(play, 5000);
  </script>
</body>
</html>
