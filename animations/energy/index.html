<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Flame - MultiCBA</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;max-width:100%;max-height:75vh}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(0,0,0,.9);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.bar button,.bar a{background:#310;color:#f80;border:1px solid #f80;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;text-decoration:none}.bar button:disabled{opacity:.5}.bar span{color:#666;font-size:.85rem}body.preview .bar{display:none}</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div class="bar"><span>Energy Flame · 5s</span><button id="dl">⬇ Download Video</button><a href="../../index.html">← Gallery</a></div>
<script src="../../js/download.js"></script>
<script>
if(location.search.includes('preview=1'))document.body.classList.add('preview');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let t=0;
function draw(){t+=0.016;const bg=ctx.createRadialGradient(320,280,20,320,180,200);bg.addColorStop(0,'#1a0a00');bg.addColorStop(1,'#000');ctx.fillStyle=bg;ctx.fillRect(0,0,640,360);
for(let i=0;i<7;i++){const h=40+Math.sin(t*5+i)*25+Math.random()*10;const x=280+i*12;const g=ctx.createLinearGradient(x,280,x,280-h);g.addColorStop(0,'#ff4400');g.addColorStop(0.5,'#ffaa00');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,280-h/2,10,h/2,0,0,Math.PI*2);ctx.fill();}
requestAnimationFrame(draw);}draw();
const actx=new(window.AudioContext||window.webkitAudioContext)();
function snd(){if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(150,actx.currentTime);o.frequency.linearRampToValueAtTime(70,actx.currentTime+0.6);g.gain.setValueAtTime(0.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.6);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.65);}
setTimeout(snd,300);setInterval(snd,5000);
MultiCBABindDownload('dl',canvas,5,'energy-flame');
</script></body></html>
